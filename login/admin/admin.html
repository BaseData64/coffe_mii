<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makiiverse - Panel de Administración</title>
    <style>
        body {
            background-color: #f4f1eb;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 { color: #333; text-align: center; }
        .solicitud-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px dashed #ddd;
            gap: 15px;
        }
        .solicitud-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .solicitud-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #ccc;
        }
        .acciones {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-aprobar { background-color: #3fb927; color: white; }
        .btn-rechazar { background-color: #e60012; color: white; }
        .vacio { text-align: center; color: #777; padding: 20px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>Usuarios Registrados / Moderación</h2>
        <div id="listaSolicitudes">
            <p class="vacio">Cargando usuarios desde Firebase...</p>
        </div>
    </div>

    <!-- Importamos Firebase con tipo módulo para la administración -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBC1CU5NvbyYvgb6W2nbxAWXtdPV63qhnA",
            authDomain: "maki-s-bio.firebaseapp.com",
            projectId: "maki-s-bio",
            storageBucket: "maki-s-bio.firebasestorage.app",
            messagingSenderId: "267692056127",
            appId: "1:267692056127:web:9c27358418af47d5a3228a",
            measurementId: "G-4TLE1P5X6F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.addEventListener('DOMContentLoaded', () => {
            cargarUsuariosFirebase();
        });

        async function cargarUsuariosFirebase() {
            const contenedor = document.getElementById('listaSolicitudes');
            
            try {
                // Obtenemos la lista de usuarios desde la base de datos en tiempo real
                const usersRef = ref(db, 'users');
                const snapshot = await get(usersRef);

                if (!snapshot.exists()) {
                    contenedor.innerHTML = '<p class="vacio">No hay usuarios registrados en la base de datos.</p>';
                    return;
                }

                contenedor.innerHTML = '';
                const usersData = snapshot.val();

                Object.keys(usersData).forEach(uid => {
                    const userData = usersData[uid];
                    const pnid = userData.pnid || userData.username || "Desconocido";

                    const card = document.createElement('div');
                    card.className = 'solicitud-card';

                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'solicitud-info';

                    // Renderizar el Mii usando la API oficial de Pretendo basada en el PNID
                    const img = document.createElement('img');
                    img.src = `https://mii-unsecure.ariankordi.net/miis/image.png?nnid=${encodeURIComponent(pnid)}&type=face&width=270&api_id=1`;
                    
                    const texto = document.createElement('div');
                    texto.innerHTML = `<strong>${pnid}</strong><br><small style="color:#777;">Posts: ${userData.postCount || 0}</small>`;

                    infoDiv.appendChild(img);
                    infoDiv.appendChild(texto);

                    // Botones de acción de baneo o control
                    const accionesDiv = document.createElement('div');
                    accionesDiv.className = 'acciones';

                    const btnBanear = document.createElement('button');
                    btnBanear.className = 'btn-rechazar';
                    btnBanear.textContent = 'Eliminar / Banear';
                    btnBanear.onclick = function() { banearUsuario(uid, pnid); };

                    accionesDiv.appendChild(btnBanear);

                    card.appendChild(infoDiv);
                    card.appendChild(accionesDiv);
                    contenedor.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar usuarios:", error);
                contenedor.innerHTML = '<p class="vacio">Error al conectar con la base de datos.</p>';
            }
        }

        async function banearUsuario(uid, pnid) {
            if (confirm(`¿Estás seguro de eliminar/banear al usuario ${pnid}?`)) {
                try {
                    // Elimina el nodo del usuario de la base de datos
                    await remove(ref(db, 'users/' + uid));
                    alert(`El usuario ${pnid} ha sido eliminado de la base de datos.`);
                    cargarUsuariosFirebase();
                } catch (error) {
                    alert("Hubo un error al intentar eliminar al usuario.");
                    console.error(error);
                }
            }
        }
    </script>
</body>
</html>
